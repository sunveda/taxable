name: Deploy API (AWS Lambda)

# Builds apps/api and uploads it to the Lambda function svdt-taxable-api.
# Infrastructure (function, Function URL, roles) is Terraform in sunveda/iac, `taxable/`.
# The job runs in the "production" environment, which only main can deploy to; only that
# environment can assume the deploy role, which can do nothing but update this function's code.

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      FUNCTION_NAME: svdt-taxable-api
      DEPLOY_ROLE: arn:aws:iam::831738147814:role/github-sunveda-taxable-deploy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @svdt/api build:lambda
      - name: Package
        working-directory: apps/api/.lambda
        run: zip -qr ../lambda.zip .

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://apps/api/lambda.zip \
            --query '{version: Version, sha256: CodeSha256}' --output table
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

      - name: Smoke test
        run: |
          url=$(aws lambda get-function-url-config --function-name "$FUNCTION_NAME" --query FunctionUrl --output text)
          curl --fail --silent --show-error --max-time 30 "${url}v1/health"
          echo
          echo "### Deployed \`$FUNCTION_NAME\`: ${url}" >> "$GITHUB_STEP_SUMMARY"
