name: Claude Code Review

# Claude reviews every pull request and leaves comments on it.
# Needs the CLAUDE_CODE_OAUTH_TOKEN repo secret (from `claude setup-token`)
# and the Claude GitHub App installed on this repo.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip drafts and PRs from forks (forks can't read repo secrets).
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Focus on:
            - Bugs and logic errors
            - Security problems (leaked secrets, unsafe input handling)
            - Things that will break for users (broken links, layout, missing files)
            - Missing or wrong tests

            Be brief. Skip style nitpicks. Use inline comments for specific
            lines, and one short summary comment at the end. If nothing is
            wrong, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
